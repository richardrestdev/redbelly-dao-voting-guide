<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1016" width="400" height="1016" font-family="Be Vietnam Pro, Segoe UI, sans-serif" role="img" aria-labelledby="d2m-t d2m-d">
  <title id="d2m-t">When eligibility is checked</title>
  <desc id="d2m-d">Portrait timeline. When the proposal is published its snapshot block is taken and voting opens. Wallet A was verified before the snapshot and can vote. Wallet B was verified while voting was open, so it cannot vote on this proposal but can vote on the next one. Tokens received after the snapshot add no power.</desc>
  <style>@import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap");</style>
  <rect x="0" y="0" width="400" height="1016" rx="8" fill="#141f26"/>

  <text x="24" y="40" font-size="22" fill="#f1f5f8" font-weight="700">When eligibility is checked</text>
  <text x="24" y="62" font-size="13" fill="#8fa1ad">Each proposal checks wallets once, at its</text>
  <text x="24" y="80" font-size="13" fill="#8fa1ad">snapshot block, taken just before voting opens</text>
  <g transform="translate(0,96)">
  <defs><clipPath id="d2m-clip-b"><rect x="286" y="324" width="20" height="382">
    <animate attributeName="height" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;382;382;0;0" keyTimes="0.0000;0.3069;0.6453;0.9500;0.9833;1.0000"/>
  </rect></clipPath></defs>
  <rect x="16" y="150" width="368" height="410" rx="4" fill="#1d3140">
    <animate attributeName="height" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;410;410;0;0" keyTimes="0.0000;0.1423;0.5173;0.9500;0.9833;1.0000"/>
  </rect>
  <g><text x="32" y="250" font-size="15" fill="#c2ced6" font-weight="600">Voting open</text><text x="32" y="269" font-size="13" fill="#8fa1ad">the proposal sets</text><text x="32" y="286" font-size="13" fill="#8fa1ad">its own length</text>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.2429;0.2679;0.9500;0.9833;1.0000"/>
  </g>
  <line x1="24" y1="40" x2="24" y2="860" stroke="#34444f" stroke-width="2"/>
  <path d="M17 852 l7 10 l7 -10" fill="none" stroke="#34444f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="34" y="878" font-size="11" font-weight="600" letter-spacing="1.6" fill="#8fa1ad">TIME</text>
  <text x="176" y="24" font-size="11" font-weight="600" letter-spacing="1.6" fill="#8fa1ad" text-anchor="middle">WALLET A</text>
  <text x="296" y="24" font-size="11" font-weight="600" letter-spacing="1.6" fill="#8fa1ad" text-anchor="middle">WALLET B</text>
  <line x1="16" y1="150" x2="384" y2="150" stroke="#EF5350" stroke-width="3" stroke-linecap="round"/>
  <text x="32" y="176" font-size="14.5" fill="#f1f5f8" font-weight="700">Proposal published</text>
  <text x="32" y="194" font-size="13" fill="#ffb3ae">snapshot block</text>
  <text x="32" y="210" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="#ffb3ae">e.g. #3208192</text>
  <line x1="16" y1="560" x2="384" y2="560" stroke="#8fa1ad" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="32" y="584" font-size="14.5" fill="#f1f5f8" font-weight="700">Voting closes</text>
  <line x1="16" y1="700" x2="384" y2="700" stroke="#EF5350" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="32" y="724" font-size="14.5" fill="#f1f5f8" font-weight="700">Next proposal</text>
  <rect x="16" y="152" width="368" height="708" fill="#EF5350" opacity="0">
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;0.16;0;0" keyTimes="0.0000;0.1441;0.1508;0.2024;1.0000"/>
  </rect>
  <rect x="16" y="702" width="368" height="158" fill="#EF5350" opacity="0">
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;0.16;0;0" keyTimes="0.0000;0.6472;0.6538;0.7055;1.0000"/>
  </rect>
  <path d="M176 80 L176 560" pathLength="1" fill="none" stroke="#86EFAC" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" dur="12s" begin="0s" repeatCount="indefinite" values="0 1;0 1;1 0;1 0;0 1;0 1" keyTimes="0.0000;0.0783;0.5173;0.9500;0.9833;1.0000"/>
  </path>
  <g><circle cx="176" cy="80" r="8" fill="#86EFAC"/><text x="190" y="84" font-size="13.5" fill="#c2ced6">Verified</text>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.0783;0.0949;0.9500;0.9833;1.0000"/>
  </g>
  <g><text x="186" y="360" font-size="14" fill="#86EFAC" font-weight="700">Can vote on</text><text x="186" y="378" font-size="14" fill="#86EFAC" font-weight="700">this proposal</text>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.1880;0.2130;0.9500;0.9833;1.0000"/>
  </g>
  <path d="M296 330 L296 700" clip-path="url(#d2m-clip-b)" fill="none" stroke="#ffb4ab" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
  <path d="M296 700 L296 800" pathLength="1" fill="none" stroke="#86EFAC" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" dur="12s" begin="0s" repeatCount="indefinite" values="0 1;0 1;1 0;1 0;0 1;0 1" keyTimes="0.0000;0.6453;0.7368;0.9500;0.9833;1.0000"/>
  </path>
  <g><circle cx="296" cy="330" r="8" fill="#ffb4ab"/><text x="308" y="326" font-size="13.5" fill="#c2ced6">Verified</text><text x="308" y="343" font-size="13.5" fill="#c2ced6">after the</text><text x="308" y="360" font-size="13.5" fill="#c2ced6">snapshot</text>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.3069;0.3236;0.9500;0.9833;1.0000"/>
  </g>
  <circle cx="296" cy="330" r="8" fill="none" stroke="#ffb4ab" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="12s" begin="0s" repeatCount="indefinite" values="8;8;22;22" keyTimes="0.0000;0.3069;0.3736;1.0000"/>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0.0000;0.3069;0.3111;0.3736;1.0000"/>
  </circle>
  <g><text x="306" y="480" font-size="14" fill="#ffb4ab" font-weight="700">Not eligible</text><text x="306" y="498" font-size="14" fill="#ffb4ab" font-weight="700">for this one</text>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4075;0.4325;0.9500;0.9833;1.0000"/>
  </g>
  <g><text x="306" y="744" font-size="14" fill="#86EFAC" font-weight="700">Eligible</text><text x="306" y="762" font-size="14" fill="#86EFAC" font-weight="700">from here</text>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6636;0.6886;0.9500;0.9833;1.0000"/>
  </g>
  <g><circle cx="40" cy="806" r="7" fill="none" stroke="#c2ced6" stroke-width="2.5"/><text x="56" y="804" font-size="14" fill="#c2ced6">Tokens received after the snapshot</text><text x="56" y="823" font-size="14" fill="#c2ced6">add no power to this proposal</text>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.7185;0.7435;0.9500;0.9833;1.0000"/>
  </g>
  <text x="384" y="904" font-size="13" fill="#8fa1ad" text-anchor="end">Last verified 30 Oct 2026</text>
  <g opacity="0"><line x1="16" y1="40" x2="384" y2="40" stroke="#f1f5f8" stroke-width="1.5"/>
    <path d="M12 33 v14 l9 -7 z" fill="#f1f5f8"/>
    <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="0 0;0 0;0 820;0 820" keyTimes="0;0.0417;0.7917;1"/>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;0.7;0.7;0;0" keyTimes="0.0000;0.0417;0.0583;0.7917;0.8333;1.0000"/>
  </g>
  </g>
</svg>
